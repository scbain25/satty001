services:
  api:
    build:
      context: .
      dockerfile: infra.Dockerfile.api
    ports:
      - "8000:8000"
  web:
    build:
      context: .
      dockerfile: infra.Dockerfile.web
    environment:
      - VITE_API_URL=http://api:8000
    ports:
      - "5173:5173"
    depends_on:
      - api
