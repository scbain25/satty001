<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ImmunoDigest — Daily Immunology & Rheumatology Curator</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #0f1117;
      --surface: #1a1d27;
      --border: #2a2d3a;
      --text: #e4e4e7;
      --muted: #9ca3af;
      --accent: #6366f1;
      --accent-glow: rgba(99, 102, 241, 0.15);
      --academic: #10b981;
      --reddit: #ff4500;
      --youtube: #ff0000;
      --substack: #ff6719;
      --twitter: #1d9bf0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 2rem 2rem 1rem;
      max-width: 900px;
      margin: 0 auto;
    }

    h1 {
      font-size: 1.8rem;
      font-weight: 700;
      background: linear-gradient(135deg, var(--accent), #a78bfa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .subtitle { color: var(--muted); font-size: 0.9rem; margin-top: 0.25rem; }

    .header-meta { display: flex; align-items: center; gap: 0.75rem; }
    #last-updated { color: var(--muted); font-size: 0.8rem; }

    #refresh-btn {
      background: var(--surface); border: 1px solid var(--border); color: var(--text);
      font-size: 1.2rem; width: 36px; height: 36px; border-radius: 8px; cursor: pointer;
      transition: all 0.2s;
    }
    #refresh-btn:hover { background: var(--accent-glow); border-color: var(--accent); }
    #refresh-btn.spinning { animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .filters {
      display: flex; gap: 0.5rem; padding: 1rem 2rem;
      max-width: 900px; margin: 0 auto; overflow-x: auto;
    }

    .filter-btn {
      background: var(--surface); border: 1px solid var(--border); color: var(--muted);
      padding: 0.5rem 1rem; border-radius: 20px; cursor: pointer; font-size: 0.85rem;
      white-space: nowrap; transition: all 0.2s;
    }
    .filter-btn:hover { color: var(--text); border-color: var(--accent); }
    .filter-btn.active { background: var(--accent); color: white; border-color: var(--accent); }

    .feed {
      max-width: 900px; margin: 0 auto; padding: 0.5rem 2rem 2rem;
      display: flex; flex-direction: column; gap: 1rem;
    }

    .loading { text-align: center; color: var(--muted); padding: 4rem 0; font-size: 1rem; }

    .card {
      background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
      padding: 1.25rem; transition: all 0.2s; cursor: pointer; text-decoration: none;
      color: inherit; display: block;
    }
    .card:hover {
      border-color: var(--accent); box-shadow: 0 0 20px var(--accent-glow);
      transform: translateY(-1px);
    }

    .card-header {
      display: flex; justify-content: space-between; align-items: flex-start;
      gap: 1rem; margin-bottom: 0.5rem;
    }

    .card-rank {
      font-size: 0.75rem; font-weight: 700; color: var(--accent);
      background: var(--accent-glow); padding: 0.2rem 0.5rem; border-radius: 6px; flex-shrink: 0;
    }

    .card-title { font-size: 1.05rem; font-weight: 600; line-height: 1.4; flex: 1; }

    .card-snippet {
      color: var(--muted); font-size: 0.85rem; line-height: 1.5; margin-bottom: 0.75rem;
      display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
    }

    .card-footer { display: flex; justify-content: space-between; align-items: center; }
    .card-source { display: flex; align-items: center; gap: 0.4rem; font-size: 0.8rem; }

    .source-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
    .source-dot.academic { background: var(--academic); }
    .source-dot.reddit { background: var(--reddit); }
    .source-dot.youtube { background: var(--youtube); }
    .source-dot.substack { background: var(--substack); }
    .source-dot.twitter { background: var(--twitter); }

    .card-source-name { color: var(--muted); }
    .card-time { font-size: 0.75rem; color: var(--muted); }

    .source-tag {
      font-size: 0.7rem; padding: 0.15rem 0.5rem; border-radius: 10px;
      font-weight: 500; text-transform: uppercase; letter-spacing: 0.5px;
    }
    .source-tag.academic { background: rgba(16,185,129,0.15); color: var(--academic); }
    .source-tag.video { background: rgba(255,0,0,0.15); color: var(--youtube); }
    .source-tag.tweet { background: rgba(29,155,240,0.15); color: var(--twitter); }
    .source-tag.article { background: rgba(255,103,25,0.15); color: var(--substack); }

    .empty-state { text-align: center; padding: 4rem 0; color: var(--muted); }

    .progress-bar {
      max-width: 900px; margin: 0 auto; padding: 0 2rem;
    }
    .progress-track {
      height: 3px; background: var(--border); border-radius: 2px; overflow: hidden;
    }
    .progress-fill {
      height: 100%; background: var(--accent); border-radius: 2px;
      transition: width 0.3s; width: 0%;
    }
    .progress-text {
      color: var(--muted); font-size: 0.75rem; margin-top: 0.5rem; text-align: center;
    }

    footer {
      text-align: center; padding: 2rem; color: var(--muted); font-size: 0.75rem;
      max-width: 900px; margin: 0 auto; border-top: 1px solid var(--border);
    }

    @media (max-width: 640px) {
      header { padding: 1.5rem 1rem 0.75rem; }
      .filters { padding: 0.75rem 1rem; }
      .feed { padding: 0.5rem 1rem 1.5rem; }
      h1 { font-size: 1.4rem; }
      .card { padding: 1rem; }
    }
  </style>
</head>
<body>
  <header>
    <div class="header-content">
      <h1>ImmunoDigest</h1>
      <p class="subtitle">Top 10 daily picks in Immunology & Rheumatology</p>
    </div>
    <div class="header-meta">
      <span id="last-updated"></span>
      <button id="refresh-btn" title="Refresh feeds">&#x21bb;</button>
    </div>
  </header>

  <nav class="filters">
    <button class="filter-btn active" data-type="all">All</button>
    <button class="filter-btn" data-type="academic">Academic</button>
    <button class="filter-btn" data-type="article">Articles</button>
    <button class="filter-btn" data-type="video">Videos</button>
  </nav>

  <div class="progress-bar" id="progress" style="display:none">
    <div class="progress-track"><div class="progress-fill" id="progress-fill"></div></div>
    <div class="progress-text" id="progress-text"></div>
  </div>

  <main id="feed" class="feed">
    <div class="loading">Loading curated content...</div>
  </main>

  <footer>
    <p>Sources: ACR, Annals of Rheumatic Diseases, Nature Immunology, Reddit, Substack, YouTube</p>
  </footer>

  <script>
    // --- Feed Configuration ---
    const FEEDS = [
      { url: 'https://www.reddit.com/r/rheumatology/.rss', source: 'r/rheumatology', sourceType: 'article', quality: 0.6, icon: 'reddit' },
      { url: 'https://www.reddit.com/r/immunology/.rss', source: 'r/immunology', sourceType: 'article', quality: 0.6, icon: 'reddit' },
      { url: 'https://ard.bmj.com/rss/current.xml', source: 'Annals of the Rheumatic Diseases', sourceType: 'academic', quality: 1.0, icon: 'academic' },
      { url: 'https://acrjournals.onlinelibrary.wiley.com/action/showFeed?jc=23265205&type=etoc&feed=rss', source: 'ACR - Arthritis & Rheumatology', sourceType: 'academic', quality: 1.0, icon: 'academic' },
      { url: 'https://www.nature.com/ni.rss', source: 'Nature Immunology', sourceType: 'academic', quality: 1.0, icon: 'academic' },
      { url: 'https://www.youtube.com/feeds/videos.xml?channel_id=UCZYTClx2T1of7BRZ86-8fow', source: 'Ninja Nerd', sourceType: 'video', quality: 0.8, icon: 'youtube' },
      { url: 'https://www.youtube.com/feeds/videos.xml?channel_id=UCNI0qOojpkhsUtaQ4_2NUhQ', source: 'ACR Education', sourceType: 'video', quality: 0.9, icon: 'youtube' },
      { url: 'https://www.youtube.com/feeds/videos.xml?channel_id=UC0QHWhjbe5fGJEPz3sVb6nw', source: 'MedCram', sourceType: 'video', quality: 0.7, icon: 'youtube' },
      { url: 'https://yourlocalepidemiologist.substack.com/feed', source: 'Your Local Epidemiologist', sourceType: 'article', quality: 0.8, icon: 'substack' },
      { url: 'https://groundtruths.substack.com/feed', source: 'Ground Truths (Eric Topol)', sourceType: 'article', quality: 0.9, icon: 'substack' },
    ];

    const KEYWORDS = [
      'immunology','rheumatology','autoimmune','autoimmunity',
      'rheumatoid arthritis','lupus','sle','sjogren','vasculitis',
      'scleroderma','myositis','psoriatic arthritis','ankylosing spondylitis',
      'gout','osteoarthritis','fibromyalgia','antiphospholipid',
      't cell','b cell','cytokine','interleukin','tnf','interferon',
      'antibody','immunoglobulin','complement','inflammation',
      'innate immunity','adaptive immunity','immune response',
      'biologic','dmard','methotrexate','rituximab','jak inhibitor',
      'corticosteroid','hydroxychloroquine','immunosuppressant',
      'checkpoint inhibitor','car-t','immunotherapy'
    ];

    // --- CORS Proxy ---
    const PROXY = 'https://api.allorigins.win/raw?url=';

    // --- Scoring ---
    function scoreItem(item) {
      let score = 0;
      const text = `${item.title} ${item.snippet} ${item.categories}`.toLowerCase();

      let hits = 0;
      for (const kw of KEYWORDS) { if (text.includes(kw)) hits++; }
      score += Math.min(hits * 5, 40);

      const ageH = (Date.now() - new Date(item.pubDate).getTime()) / 3600000;
      if (ageH <= 12) score += 30;
      else if (ageH <= 24) score += 25;
      else if (ageH <= 48) score += 15;
      else if (ageH <= 72) score += 5;

      score += (item.quality || 0.5) * 20;
      return Math.round(score * 10) / 10;
    }

    // --- Feed Fetching ---
    async function fetchFeed(feedConfig) {
      try {
        const res = await fetch(PROXY + encodeURIComponent(feedConfig.url));
        if (!res.ok) throw new Error(res.status);
        const text = await res.text();
        const doc = new DOMParser().parseFromString(text, 'text/xml');

        // Handle Atom (YouTube) vs RSS
        const isAtom = !!doc.querySelector('feed');
        const entries = isAtom
          ? [...doc.querySelectorAll('entry')]
          : [...doc.querySelectorAll('item')];

        return entries.map(el => {
          const title = el.querySelector('title')?.textContent || '';
          let link = '';
          if (isAtom) {
            link = el.querySelector('link')?.getAttribute('href') || '';
          } else {
            link = el.querySelector('link')?.textContent || '';
          }
          const desc = el.querySelector('description')?.textContent
            || el.querySelector('summary')?.textContent
            || el.querySelector('content')?.textContent || '';
          const pubDate = el.querySelector('pubDate')?.textContent
            || el.querySelector('published')?.textContent
            || el.querySelector('updated')?.textContent || '';
          const cats = [...el.querySelectorAll('category')].map(c => c.textContent || c.getAttribute('term') || '').join(', ');

          return {
            title, link,
            snippet: stripHtml(desc).slice(0, 300),
            pubDate: pubDate || new Date().toISOString(),
            source: feedConfig.source,
            sourceType: feedConfig.sourceType,
            quality: feedConfig.quality,
            icon: feedConfig.icon,
            categories: cats
          };
        });
      } catch (err) {
        console.warn(`Failed: ${feedConfig.source} — ${err.message}`);
        return [];
      }
    }

    async function fetchAllFeeds() {
      const progressEl = document.getElementById('progress');
      const fillEl = document.getElementById('progress-fill');
      const textEl = document.getElementById('progress-text');
      progressEl.style.display = 'block';

      let completed = 0;
      const total = FEEDS.length;
      const allItems = [];

      const promises = FEEDS.map(async (f) => {
        const items = await fetchFeed(f);
        completed++;
        fillEl.style.width = `${(completed / total) * 100}%`;
        textEl.textContent = `Fetching feeds... ${completed}/${total}`;
        return items;
      });

      const results = await Promise.allSettled(promises);
      results.forEach(r => { if (r.status === 'fulfilled') allItems.push(...r.value); });

      progressEl.style.display = 'none';

      const scored = allItems
        .map(item => ({ ...item, score: scoreItem(item) }))
        .filter(item => item.score > 10)
        .sort((a, b) => b.score - a.score)
        .slice(0, 10);

      return scored;
    }

    // --- Rendering ---
    function stripHtml(html) {
      const tmp = document.createElement('div');
      tmp.innerHTML = html;
      return tmp.textContent || '';
    }

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    function timeAgo(dateStr) {
      const diff = Date.now() - new Date(dateStr).getTime();
      const hours = Math.floor(diff / 3600000);
      if (hours < 1) return 'Just now';
      if (hours < 24) return `${hours}h ago`;
      return `${Math.floor(hours / 24)}d ago`;
    }

    function renderItems(items) {
      const feed = document.getElementById('feed');
      if (!items.length) {
        feed.innerHTML = '<div class="empty-state">No items found. Try refreshing or selecting a different category.</div>';
        return;
      }
      feed.innerHTML = items.map((item, i) => `
        <a class="card" href="${escapeHtml(item.link)}" target="_blank" rel="noopener">
          <div class="card-header">
            <span class="card-rank">#${i + 1}</span>
            <span class="card-title">${escapeHtml(item.title)}</span>
            <span class="source-tag ${item.sourceType}">${item.sourceType}</span>
          </div>
          ${item.snippet ? `<div class="card-snippet">${escapeHtml(item.snippet)}</div>` : ''}
          <div class="card-footer">
            <div class="card-source">
              <span class="source-dot ${item.icon}"></span>
              <span class="card-source-name">${escapeHtml(item.source)}</span>
            </div>
            <span class="card-time">${timeAgo(item.pubDate)}</span>
          </div>
        </a>
      `).join('');
    }

    // --- State ---
    let allItems = [];
    let currentFilter = 'all';

    function applyFilter() {
      const filtered = currentFilter === 'all'
        ? allItems
        : allItems.filter(i => i.sourceType === currentFilter);
      renderItems(filtered);
    }

    async function loadContent() {
      document.getElementById('feed').innerHTML = '<div class="loading">Loading curated content...</div>';
      allItems = await fetchAllFeeds();
      document.getElementById('last-updated').textContent = `Updated ${new Date().toLocaleTimeString()}`;
      applyFilter();
    }

    // --- Events ---
    document.querySelectorAll('.filter-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentFilter = btn.dataset.type;
        applyFilter();
      });
    });

    document.getElementById('refresh-btn').addEventListener('click', async () => {
      const btn = document.getElementById('refresh-btn');
      btn.classList.add('spinning');
      await loadContent();
      btn.classList.remove('spinning');
    });

    loadContent();
  </script>
</body>
</html>
