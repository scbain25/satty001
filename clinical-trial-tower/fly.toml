# Fly.io deployment configuration
# Deploy with: flyctl launch --config clinical-trial-tower/fly.toml

app = "clinical-trial-tower"
primary_region = "iad"

[build]
  dockerfile = "backend/Dockerfile"

[env]
  PYTHONPATH = "/app"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 256
