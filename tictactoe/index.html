<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tic-Tac-Toe</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: linear-gradient(120deg, #eef2ff 0%, #f8fafc 50%, #dbeafe 100%);
      color: #0f172a;
    }

    .app {
      width: min(92vw, 420px);
      background: rgba(255, 255, 255, 0.85);
      border: 1px solid #dbeafe;
      border-radius: 18px;
      box-shadow: 0 18px 45px rgba(15, 23, 42, 0.15);
      padding: 1.25rem;
      backdrop-filter: blur(6px);
    }

    h1 {
      text-align: center;
      margin: 0 0 0.75rem;
      font-size: 1.7rem;
    }

    .status {
      text-align: center;
      margin-bottom: 1rem;
      font-weight: 600;
      color: #1d4ed8;
      min-height: 1.5em;
    }

    .board {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0.6rem;
    }

    .cell {
      width: 100%;
      aspect-ratio: 1;
      border: none;
      border-radius: 12px;
      background: #eff6ff;
      color: #1e293b;
      font-size: clamp(2rem, 8vw, 2.8rem);
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.08s ease, background 0.2s ease;
    }

    .cell:hover:enabled {
      background: #dbeafe;
      transform: translateY(-1px);
    }

    .cell:disabled {
      cursor: default;
      opacity: 0.95;
    }

    .controls {
      display: flex;
      justify-content: center;
      margin-top: 1rem;
    }

    button.reset {
      border: none;
      border-radius: 10px;
      padding: 0.6rem 1rem;
      font-size: 0.95rem;
      font-weight: 600;
      color: white;
      background: #2563eb;
      cursor: pointer;
    }

    button.reset:hover {
      background: #1d4ed8;
    }
  </style>
</head>
<body>
  <main class="app" aria-label="Tic-Tac-Toe game">
    <h1>Tic-Tac-Toe</h1>
    <p class="status" id="status">Player X's turn</p>
    <section class="board" id="board" aria-label="Game board"></section>
    <div class="controls">
      <button class="reset" id="reset" type="button">Reset Game</button>
    </div>
  </main>

  <script>
    const winningLines = [
      [0, 1, 2], [3, 4, 5], [6, 7, 8],
      [0, 3, 6], [1, 4, 7], [2, 5, 8],
      [0, 4, 8], [2, 4, 6]
    ];

    const boardElement = document.getElementById('board');
    const statusElement = document.getElementById('status');
    const resetButton = document.getElementById('reset');

    let board = Array(9).fill('');
    let currentPlayer = 'X';
    let gameOver = false;

    function renderBoard() {
      boardElement.innerHTML = '';

      board.forEach((value, index) => {
        const cell = document.createElement('button');
        cell.className = 'cell';
        cell.type = 'button';
        cell.textContent = value;
        cell.disabled = gameOver || value !== '';
        cell.setAttribute('aria-label', `Cell ${index + 1} ${value || 'empty'}`);
        cell.addEventListener('click', () => handleMove(index));
        boardElement.appendChild(cell);
      });
    }

    function getWinner() {
      for (const [a, b, c] of winningLines) {
        if (board[a] && board[a] === board[b] && board[b] === board[c]) {
          return board[a];
        }
      }
      return null;
    }

    function handleMove(index) {
      if (gameOver || board[index]) return;

      board[index] = currentPlayer;

      const winner = getWinner();
      if (winner) {
        gameOver = true;
        statusElement.textContent = `Player ${winner} wins!`;
      } else if (!board.includes('')) {
        gameOver = true;
        statusElement.textContent = "It's a draw!";
      } else {
        currentPlayer = currentPlayer === 'X' ? 'O' : 'X';
        statusElement.textContent = `Player ${currentPlayer}'s turn`;
      }

      renderBoard();
    }

    function resetGame() {
      board = Array(9).fill('');
      currentPlayer = 'X';
      gameOver = false;
      statusElement.textContent = "Player X's turn";
      renderBoard();
    }

    resetButton.addEventListener('click', resetGame);

    renderBoard();
  </script>
</body>
</html>
